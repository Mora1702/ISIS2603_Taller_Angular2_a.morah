<div class="card mb-4">
  <div class="card-body">
    <h5 class="card-title">Nueva Ciudad</h5>
    <div class="mb-3">
      <label for="cityName" class="form-label">Nombre de la ciudad</label>
      <input
        id="cityName"
        type="text"
        class="form-control"
        [(ngModel)]="cityName"
      />
    </div>

    <div class="mb-3">
      <label for="countrySelect" class="form-label">País</label>
      <select
        id="countrySelect"
        class="form-select"
        [(ngModel)]="selectedCountryId"
      >
        <option [ngValue]="null"></option>

        @for (country of countries; track country.id) {
          <option [ngValue]="country.id">
            {{ country.name }}
          </option>
        }
      </select>
    </div>

    <div class="d-flex gap-2">
      <button
        class="btn btn-primary"
        (click)="onSave()"
        [disabled]="!cityName.trim() || selectedCountryId === null"
      >
        Guardar
      </button>

      <button
        class="btn btn-secondary"
        (click)="onCancel()"
      >
        Cancelar
      </button>
    </div>
  </div>
</div>
